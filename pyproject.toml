[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "remarkable-demystified"
version = "0.1.0"
description = "Read, edit and manage the documents on a reMarkable tablet over SSH, USB or the reMarkable cloud, with a REST API and CLI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "paramiko>=3.4",
    "rmscene>=0.7",
    "pypdf>=4.0",
    "pillow>=10.0",
    "tomli>=2.0; python_version < \"3.11\"",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
rmd = "remarkable_demystified.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/remarkable_demystified"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
